services:
  postgres:
    image: postgres:16-alpine
    container_name: uyai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-uyai_db}
      POSTGRES_USER: ${DATABASE_USER:-uyai_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-uyai_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-uyai_user} -d ${DATABASE_NAME:-uyai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: uyai_postgres_data
