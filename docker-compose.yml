# =============================================================================
# UyAI Production Docker Compose Stack
# =============================================================================
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: uyai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-uyai_db}
      POSTGRES_USER: ${DATABASE_USER:-uyai_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-uyai_user} -d ${DATABASE_NAME:-uyai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uyai_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uyai_api
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-uyai_user}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-uyai_db}
      MEDIA_STORAGE_DIR: /var/lib/uyai/media
    volumes:
      - media_data:/var/lib/uyai/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - uyai_internal

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uyai_bot
    restart: unless-stopped
    command: ["python3", "-m", "app.bot.main"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-uyai_user}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-uyai_db}
      MEDIA_STORAGE_DIR: /var/lib/uyai/media
    volumes:
      - media_data:/var/lib/uyai/media
    networks:
      - uyai_internal

  crm_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uyai_crm_worker
    restart: unless-stopped
    command: ["python3", "scripts/run_crm_worker.py"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-uyai_user}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-uyai_db}
      MEDIA_STORAGE_DIR: /var/lib/uyai/media
    volumes:
      - media_data:/var/lib/uyai/media
    networks:
      - uyai_internal

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local

networks:
  uyai_internal:
    driver: bridge
